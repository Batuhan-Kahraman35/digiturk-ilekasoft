<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çevrimdışısınız</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f4f6f9; color: #212529; padding: 24px;
    }
    .kutu { text-align: center; max-width: 380px; }
    .ikon {
      width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 50%;
      background: #e7f1ff; display: flex; align-items: center; justify-content: center;
    }
    .ikon svg { width: 44px; height: 44px; stroke: #0d6efd; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #6c757d; margin: 0 0 20px; line-height: 1.5; }
    button {
      background: #0d6efd; color: #fff; border: 0; border-radius: 8px;
      padding: 11px 22px; font-size: .95rem; cursor: pointer;
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <div class="kutu">
    <div class="ikon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
      </svg>
    </div>
    <h1>İnternet bağlantısı yok</h1>
    <p>Şu anda çevrimdışısınız. Bağlantınız geldiğinde sayfa otomatik yenilenecektir.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
